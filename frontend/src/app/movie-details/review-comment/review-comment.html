<div [class.ml-32]="isReply()" class="bg-deep-space-blue ml-16 p-2.5 flex min-w-auto gap-10 h-fit w-auto border-2 shadow-sm shadow-ink-black border-slate-500 rounded-xl">
  <div class="flex flex-col items-center ">
    <img class="rounded-[50%] aspect-square" [src]="avatarUrl()" width="50" height="50" alt="awatar użytkownika">
    <h1 class="text-gray-400 wrap-break-word text-center">{{username()}}</h1>
  </div>
  <div class="max-sm:flex max-sm:flex-col md:flex gap-x-2 w-full">
    <p class="text-sm text-gray-300 wrap-break-word break-all w-6/7">{{content()}}</p>
    <div class="flex flex-col gap-y-5">
      <p class="text-sm text-gray-300 w-1/7">{{date() | date: 'dd.MM.yyyy'}}</p>
      @if (token){
        <app-feedback-actions [id]="id()" [isReply]="isReply()" [parentId]="parentId()" [date]="date()" [username]="username()" [content]="content()" />
      }
    </div>
  </div>
</div>
