<div class="content-center h-full w-full">
  <form class="flex flex-col items-center gap-y-2" [formGroup]="registrationForm" (ngSubmit)="onRegistrationSubmit()" >
    <input class="bg-white rounded-3xl pl-2 outline-0 text-xl" type="text" formControlName="username" placeholder="Nazwa użytkownika">
    <input class="bg-white rounded-3xl pl-2 outline-0 text-xl" type="text" formControlName="email" placeholder="Adres email">
    <input class="bg-white rounded-3xl pl-2 outline-0 text-xl" type="password" formControlName="password" placeholder="Hasło">
    <input class="text-white bg-ink-black rounded-3xl p-2.5 text-2xl shadow-md shadow-ink-black" type="submit" value="Zarejestruj się">
  </form>
</div>
