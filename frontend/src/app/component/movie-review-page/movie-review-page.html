<div class="pt-10 flex gap-5 items-start">
  @if(movie(); as movie){
  <div class="flex flex-col w-full min-w-0">

    <img class="shrink-0  h-auto object-cover rounded-xl shadow-lg shadow-black/50" ngSrc="michael.jpg" priority width="500" height="300" alt="plakat filmu">
    <h1 class="text-white text-3xl leading-16">Premiera: {{movie.productionDate | date:'dd.MM.yyyy'}}r.</h1>

  </div>
  <div class="flex flex-col w-full min-w-0">
    <h1 class="text-white text-4xl text-center leading-16">{{ movie.title }}</h1>
    <p class="wrap-break-word text-gray-400"> {{movie.description}}</p>
  </div>
  } @else {
    <div class="text-white text-2xl mt-10">
      Ładowanie recenzji filmu...
    </div>
  }
</div>
<div>
  <div class="flex p-2.5">
    <h1 class="text-white text-4xl leading-16 font-bold w-3/4">Recenzje</h1>
    @if(token){
      <button class="w-1/4 bg-ink-black text-white rounded-3xl cursor-pointer" (click)="onClickScrollTo(target)">Dodaj recenzje</button>
    }
  </div>
  <div class="pt-5 flex flex-col gap-y-5 border-t-2 border-t-gray-400">
    @for (review of reviews(); track review.title) {
      <app-movie-review [title]="review.title" [rating]="review.rating"  [content]="review.content" [username]="review.username"/>
    }
    <app-review-comment/>
      <div class="transition-all" #target>
    @if(token){
        <app-review-add />
    }
      </div>
  </div>
</div>
